  message: 源码调用 CUDA 流（Stream）API，流创建、同步与事件语义需要结合目标运行时确认。
  recommendation: 请复核流与事件的使用方式，并在沐曦环境验证并发与同步行为。
  references:
    - title: MetaX-MACA cu-bridge
