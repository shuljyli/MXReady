- id: MXR-DEVICE-001
  version: 1
  title: 检测 CUDA 设备管理 API
  category: runtime
  severity: info
  file_globs: ["**/*.cu", "**/*.cuh", "**/*.cc", "**/*.cpp", "**/*.c", "**/*.h", "**/*.hpp"]
