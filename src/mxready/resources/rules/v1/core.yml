  message: 源码调用 CUDA 设备管理 API，多设备枚举与选择逻辑包含平台假设。
  recommendation: 请复核设备选择与同步逻辑，并在沐曦环境验证设备枚举与上下文行为。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-COMM-002
  version: 1
  title: 检测 torch.distributed NCCL 通信后端
  category: communication
  severity: warning
  file_globs: ["**/*.py"]
  patterns:
    - type: regex
      expression: '\b(?:init_process_group|new_group)\s*\(\s*[''"]nccl[''"]'
    - type: regex
      expression: '\b(?:init_process_group|new_group)\s*\([^\n]{0,200}\bbackend\s*=\s*[''"]nccl[''"]'
  message: 项目将分布式通信后端指定为 NCCL，迁移到沐曦环境需要确认通信库与后端的等价映射。
  recommendation: 请复核通信后端、环境变量和拓扑配置，并在沐曦多卡环境进行针对性验证。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge
  compatible_alternatives:
    - operator: 可配置分布式后端（按环境注入 backend，支持 nccl / gloo 回退）
      summary: 避免在代码内硬编码 "nccl" 字面量，改由环境变量或配置传入后端名，由各平台 PyTorch 通信层调度对应集合通信实现。
      applies_when: 多卡训练或推理仅依赖 torch.distributed 标准集合通信原语（all_reduce / broadcast / all_gather）。
      caveat: 不同通信后端在张量类型、P2P 与超时环境变量上的行为可能不同，需在目标多卡拓扑下实测验证。
      reference:
        title: PyTorch Distributed
        url: https://docs.pytorch.org/docs/stable/distributed.html

- id: MXR-DEPENDENCY-005
  version: 1
  title: 检测 apex 依赖或导入
  category: dependency
  severity: warning
  file_globs: ["**/requirements*.txt", "**/pyproject.toml", "**/setup.cfg", "**/setup.py", "**/*.py"]
  patterns:
    - type: dependency
      name: apex
    - type: dependency
      name: nvidia-apex
    - type: fact
      name: imports_apex
      equals: true
  message: 项目依赖或导入 apex，其混合精度与融合算子包含设备相关原生组件，需要单独确认目标平台版本。
  recommendation: 请复核 apex 版本、算子覆盖与混合精度路径，并在沐曦环境验证导入与核心功能。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge
  compatible_alternatives:
    - operator: torch.amp.autocast 与 torch.amp.GradScaler
      summary: 使用 PyTorch 内置自动混合精度替代 apex.amp，在 CUDA 与 MXMACA PyTorch 上使用一致的训练与缩放接口。
      applies_when: 项目仅依赖 apex 的自动混合精度（O1/O2 语义）及梯度缩放功能。
      caveat: apex.amp 的部分旧参数语义与 torch.amp 不完全一致，替换后需比对损失收敛与溢出行为。
      reference:
        title: PyTorch Automatic Mixed Precision
        url: https://docs.pytorch.org/docs/stable/amp.html
    - operator: torch.nn.LayerNorm / torch.nn.RMSNorm 与 torch.optim.AdamW
      summary: 以 PyTorch 原生归一化与优化器算子替代 apex.normalization 及 FusedAdam 等原生扩展算子。
      applies_when: 可接受使用 PyTorch 内置实现替代 apex 自定义 CUDA 融合内核时。
      caveat: 状态字典键名或融合更新步的吞吐可能与 apex 实现不同，需校验权重加载兼容性与性能。
      reference:
        title: PyTorch torch.nn
        url: https://docs.pytorch.org/docs/stable/nn.html

- id: MXR-LIBRARY-001
  version: 1
  title: 识别 cuBLAS / cuDNN / cuFFT / cuSPARSE / cuSOLVER 头文件
  category: library
  severity: warning
  file_globs: ["**/*.cu", "**/*.cuh", "**/*.cc", "**/*.cpp", "**/*.c", "**/*.h", "**/*.hpp"]
  patterns:
    - type: regex
      expression: '(?m)^\s*#\s*include\s*[<"](?:cublas|cublasLt|cudnn|cufft|cusparse|cusolver)[A-Za-z0-9_-]*\.h[>"]'
  message: 源码直接包含 NVIDIA 数学库头文件，目标环境需要由兼容层或等价库提供相应 API 映射。
  recommendation: 请复核实际使用的库 API 与链接配置，并结合 cu-bridge 当前版本在沐曦环境验证编译与数值行为。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge
    - title: MXMACA performance tuning guide
      url: https://gitee.com/metax-maca/mxmaca-performance-tuning-guide
  compatible_alternatives:
    - operator: PyTorch ATen / torch.linalg / torch.fft 通用算子
      summary: 在 Python 或 C++ 扩展层调用 ATen / PyTorch 标准线性代数与傅里叶算子，由后端统一分派至 cuBLAS/cuFFT 或 mcBLAS/mcFFT。
      applies_when: 算子逻辑以矩阵乘、卷积、FFT 或求解器为主，且无需精细控制底层数学库私有句柄或工作区策略时。
      caveat: 包装为 ATen 调用可能改变内存布局或中间张量分配策略，须验证边界形状与数值误差。
      reference:
        title: PyTorch C++/CUDA extensions
        url: https://docs.pytorch.org/docs/stable/cpp_extension.html
    - operator: cu-bridge 数学库映射（mcBLAS / mcDNN / mcFFT 等）
      summary: 保留标准 CUDA 数学库头文件与 API 调用，通过 cu-bridge 构建包装器在编译期映射至 MXMACA 对应库，同时保留 NVIDIA CUDA 原生构建。
      applies_when: 必须保留 C++ 层直接调用且所使用的具体 API 处于当前 cu-bridge 支持列表中。
      caveat: 需逐项核对所用 API、枚举值及链接库名称在目标 cu-bridge 版本中的支持状态。
      reference:
        title: MetaX-MACA cu-bridge
        url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-RUNTIME-001
  version: 1
  title: 检测 CUDA 数据拷贝与事件 Runtime API
  category: runtime
  severity: info
  file_globs: ["**/*.cu", "**/*.cuh", "**/*.cc", "**/*.cpp", "**/*.c", "**/*.h", "**/*.hpp"]
  patterns:
    - type: regex
      expression: '\bcuda(?:Memcpy|MemcpyAsync|Memcpy2D|Memcpy2DAsync|MemcpyPeer|MemcpyPeerAsync|Memset|MemsetAsync|EventCreate|EventRecord|EventSynchronize|EventQuery|EventElapsedTime|EventDestroy)\s*\('
      flags: [IGNORECASE]
  message: 源码调用 CUDA 数据拷贝或事件 API，其同步语义与错误处理需要结合目标运行时确认。
  recommendation: 请复核拷贝路径、同步点与事件使用方式，并在沐曦环境验证数据一致性与性能。
  references:
    - title: CUDA Programming Guide
      url: https://docs.nvidia.com/cuda/cuda-programming-guide/
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-TEST-001
  version: 1
  title: 检测 CUDA 可用性静默跳过测试
  category: test
  severity: warning
  file_globs: ["**/*.py"]
  patterns:
    - type: regex
      expression: 'skipif\s*\([^\n]*\bnot\s+torch\.cuda\.is_available\(\)'
    - type: regex
      expression: 'skipUnless\s*\([^\n]*torch\.cuda\.is_available\(\)'
  message: 测试在 torch.cuda 不可用时静默跳过，迁移到沐曦环境后可能因环境未配置而跳过，造成验证通过的假象。
  recommendation: 请复核跳过条件，并在真机环境手动运行核心 CUDA 测试以确认实际覆盖。
  references:
    - title: pytest skipif documentation
      url: https://docs.pytest.org/
    - title: unittest skipUnless documentation
      url: https://docs.python.org/3/library/unittest.html

- id: MXR-PYTORCH-003
  version: 1
  title: 识别 PyTorch 自动混合精度用法
  category: runtime
  severity: info
  file_globs: ["**/*.py"]
  patterns:
    - type: regex
      expression: '\b(?:torch\.cuda\.amp|torch\.amp)\b|\b(?:autocast|GradScaler)\s*\('
  message: 项目使用 PyTorch 自动混合精度，目标环境的半精度算子支持与缩放行为需要结合 MXMACA 版本验证。
  recommendation: 请复核混合精度路径与缩放器行为，并依据 MXMACA 性能指南在沐曦设备验证精度与性能。
  references:
    - title: MXMACA performance tuning guide
      url: https://gitee.com/metax-maca/mxmaca-performance-tuning-guide
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-PTX-001
  version: 1
  title: 检测内联 PTX 汇编
  category: ptx
  severity: blocker
  file_globs: ["**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.cc", "**/*.h", "**/*.hpp"]
  patterns:
    - type: regex
      expression: '\b(?:__asm__|asm)\s*(?:(?:__volatile__|volatile)\s*)?\(\s*"'
  message: 内联汇编块嵌入的是 NVIDIA 虚拟 ISA（PTX）指令，MXMACA 后端不执行 PTX；这类代码可能固化 NVIDIA 指令语义。
  recommendation: 请逐处复核 asm 块对应的硬件能力，改用目标平台支持的内建函数或等价 C++ 实现，并在沐曦环境验证功能与性能。
  references:
    - title: NVIDIA Inline PTX Assembly
      url: https://docs.nvidia.com/cuda/inline-ptx-assembly/index.html
    - title: MXMACA runtime API guide
      url: https://developer.metax-tech.com/api/client/document/preview/567/C500_RuntimeAPIProgrammingGuide_CN.html
  compatible_alternatives:
    - operator: 标准 CUDA/C++ 数学内建函数与条件编译分支
      summary: 将内联 PTX 替换为可移植的 CUDA/C++ 设备内建函数或常规 C++ 算术；确需保留 PTX 优化时通过架构宏隔离通用回退分支。
      applies_when: PTX 指令用于常见原子操作、位运算、字节序转换或数学近似，且存在标准设备函数或可移植 C++ 实现。
      caveat: 特殊底层指令（如异步拷贝或特定矩阵指令）可能存在吞吐差异，迁移后需同时完成功能对拍与性能基准测试。
      reference:
        title: NVIDIA Inline PTX Assembly
        url: https://docs.nvidia.com/cuda/inline-ptx-assembly/index.html

- id: MXR-WARP-001
  version: 1
  title: 检测硬编码 32 线程束假设
  category: warp
  severity: blocker
  file_globs: ["**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.cc", "**/*.h", "**/*.hpp"]
  patterns:
    - type: regex
      expression: '(?m)^(?!\s*(?://|/\*|\*))[^\n]*threadIdx\.x\s*[%/&]\s*(?:31|32)\b'
    - type: regex
      expression: '(?m)^\s*#\s*define\s+(?:WARP_SIZE|WARPSIZE)\s+32\b'
    - type: regex
      expression: '(?m)^(?!\s*(?://|/\*|\*))[^\n]*\b(?:WARP_SIZE|warp_size|WARPSIZE)\s*=\s*32\b'
  message: 代码按 32 线程一组计算 lane 或定义线程束宽度常量；MXMACA 的线程束（wave）宽度为 64，这类算术可能编译通过但结果错位。
  recommendation: 请复核 lane 计算与掩码宽度，改用运行时查询的线程束宽度，并在沐曦环境用最小用例比对结果。
  references:
    - title: MXMACA runtime API guide
      url: https://developer.metax-tech.com/api/client/document/preview/567/C500_RuntimeAPIProgrammingGuide_CN.html
  compatible_alternatives:
    - operator: 运行时 warpSize 常量与动态 lane 计算（threadIdx.x % warpSize）
      summary: 用 CUDA/MXMACA 均提供的内建变量 warpSize 替代写死的 32 或 31，使同一份源码在 32 宽度 CUDA 与 64 宽度 MXMACA 上按实际硬件宽度运行。
      applies_when: 内核需要手写 CUDA/C++ 线程束内索引、掩码或子块切分逻辑时。
      caveat: 若线程块大小、共享内存数组维度或位掩码类型（如 32 位 unsigned 与 64 位 uint64_t）隐含 32 限制，也需同步扩展并实测。
      reference:
        title: MXMACA runtime API guide
        url: https://developer.metax-tech.com/api/client/document/preview/567/C500_RuntimeAPIProgrammingGuide_CN.html
    - operator: PyTorch ATen 归约/扫描算子（torch.sum / torch.cumsum 等）
      summary: 当手写内核仅用于常见规约或前缀扫描时，直接复用 PyTorch 原生张量算子即可自动适配不同设备的线程束宽度。
      applies_when: 归约逻辑无需与复杂自定义前后处理融合为单个核函数。
      caveat: 拆分为多个 PyTorch 算子可能增加全局显存读写，需在目标设备确认精度与耗时。
      reference:
        title: PyTorch Tensor Operations
        url: https://docs.pytorch.org/docs/stable/torch.html

- id: MXR-THRUST-001
  version: 1
  title: 识别 Thrust 用法
