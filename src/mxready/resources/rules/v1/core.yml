      name: uses_torch_cpp_extension_load
      equals: true
  message: 项目使用 torch.utils.cpp_extension.load 在运行时编译扩展，执行环境必须具备完整工具链。
  recommendation: 请复核 JIT 源码、缓存、编译参数与依赖，并在 MXMACA 环境验证首次和重复加载。
  references:
    - title: PyTorch C++/CUDA extensions
      url: https://docs.pytorch.org/docs/stable/cpp_extension.html

- id: MXR-DOCKER-001
  version: 1
  title: 检测 NVIDIA GPU 容器基础镜像与运行时配置
  category: docker
  severity: warning
  file_globs: ["**/Dockerfile", "**/*.dockerfile", "**/docker-compose*.yml", "**/docker-compose*.yaml"]
  patterns:
    - type: regex
      expression: '^\s*FROM\s+(?:nvidia/cuda|nvcr\.io|nvidia/cudagl|nvidia/tensorrt|nvidia/tritonserver)(?:[:/\s]|$)'
      flags: [IGNORECASE, MULTILINE]
    - type: regex
      expression: '(?:nvidia-docker|nvidia-container-runtime|--gpus\s|--runtime\s*=\s*nvidia|gpus:\s*all)'
      flags: [IGNORECASE]
  message: 镜像或运行配置基于 NVIDIA GPU 容器体系，迁移到沐曦环境需要更换基础镜像与容器运行时参数。
  recommendation: 请复核基础镜像来源、--gpus/--runtime 参数与 GPU 设备挂载方式，替换为沐曦环境的等价方案后验证容器内算子。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-MEMORY-001
  version: 1
  title: 检测 CUDA 显存管理 Runtime API
