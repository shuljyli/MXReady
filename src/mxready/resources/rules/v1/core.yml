- id: MXR-BUILD-001
  version: 1
  title: 检测 TORCH_CUDA_ARCH_LIST 覆盖
  category: build
  severity: warning
  file_globs: ["**/*.py", "**/*.sh", "**/*.toml", "**/*.cfg"]
  patterns:
    - type: regex
      expression: '(?m)^\s*os\.environ\[[^\]\n]*TORCH_CUDA_ARCH_LIST[^\]\n]*\]\s*='
    - type: regex
      expression: '(?m)^\s*(?:export\s+)?TORCH_CUDA_ARCH_LIST\s*='
  message: 项目显式覆盖 TORCH_CUDA_ARCH_LIST，构建产物可能绑定 NVIDIA 架构列表。
  recommendation: 请复核 PyTorch 扩展的架构选择方式，移除不适用假设，并在 MXMACA 环境验证构建。
  references:
    - title: PyTorch C++/CUDA extensions
      url: https://docs.pytorch.org/docs/stable/cpp_extension.html

- id: MXR-PYTORCH-002
  version: 1
  title: 识别 PyTorch JIT 原生扩展
  category: pytorch-extension
  severity: info
  file_globs: ["**/*.py"]
  patterns:
