  recommendation: 请复核 CUDAToolkit_ROOT、导入目标和链接库，并在 cu-bridge 环境验证 CMake 配置。
  references:
    - title: CMake FindCUDAToolkit
      url: https://cmake.org/cmake/help/latest/module/FindCUDAToolkit.html

- id: MXR-ARCH-001
