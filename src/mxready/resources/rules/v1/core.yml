  recommendation: 请复核显存分配/释放调用点与错误处理，并结合 cu-bridge 当前版本在沐曦环境验证。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-STREAM-001
  version: 1
