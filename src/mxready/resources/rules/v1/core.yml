  recommendation: 请复核 CMake 工具链选择和语言探测结果，并在 MXMACA/cu-bridge 环境验证配置阶段。
  references:
    - title: CMake FindCUDAToolkit
      url: https://cmake.org/cmake/help/latest/module/FindCUDAToolkit.html

- id: MXR-CMAKE-002
  version: 1
  title: 检测 CMake FindCUDAToolkit
  category: cmake
  severity: warning
  file_globs: ["**/CMakeLists.txt", "**/*.cmake"]
  patterns:
