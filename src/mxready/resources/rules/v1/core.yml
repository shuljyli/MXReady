- id: MXR-INTRINSIC-001
  version: 1
  title: 检测 CUDA warp 同步内建函数
  category: intrinsic
  severity: warning
  file_globs: ["**/*.cu", "**/*.cuh", "**/*.cc", "**/*.cpp", "**/*.h", "**/*.hpp"]
  patterns:
    - type: regex
      expression: '\b__(?:shfl(?:_(?:up|down|xor))?_sync|ballot_sync|activemask)\s*\('
  message: 内核使用 warp 同步内建函数，其掩码、warp 宽度和硬件执行假设需要复核。
  recommendation: 请复核内建函数语义与 warp 假设，并依据性能指南在沐曦设备验证正确性和性能。
  references:
    - title: CUDA Programming Guide
      url: https://docs.nvidia.com/cuda/cuda-programming-guide/
    - title: MXMACA performance tuning guide
      url: https://gitee.com/metax-maca/mxmaca-performance-tuning-guide
  compatible_alternatives:
    - operator: 共享内存（__shared__）+ __syncthreads() 通用归约
      summary: 使用线程块共享内存与显式同步替代 warp 级洗牌/投票内建函数，消除 32 线程束宽度与掩码耦合。
      applies_when: 内核需要同时兼容 NVIDIA CUDA（warp=32）与 MXMACA（wave=64）且允许以块内规约替代跨线程直接寄存器交换。
      caveat: 共享内存占用与同步开销高于寄存器洗牌，需结合块尺寸和寄存器压力实测性能与结果。
      reference:
        title: CUDA Programming Guide
        url: https://docs.nvidia.com/cuda/cuda-programming-guide/
    - operator: CUB / Thrust 块级原语（cub::BlockReduce / thrust::reduce）
      summary: 借助模板化块级/设备级原语，由 CUDA CUB 与 MXMACA mcCUB 在编译期分别按硬件宽度展开。
      applies_when: 代码实现归约、前缀和或排序等标准模式，且目标环境已启用 mcCUB/mcThrust 映射。
      caveat: 模板参数中的线程数、对齐和头文件版本需与目标工具链匹配并在真机验证编译与数值。
      reference:
        title: MXMACA AI training manual
        url: https://developer.metax-tech.com/api/client/document/preview/587/C500_AITrainningMaunal_CN.html

