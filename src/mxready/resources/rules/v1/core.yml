  recommendation: 请复核 Thrust 版本与 mcThrust 的对应关系，并在沐曦环境验证编译与结果。
  references:
    - title: MXMACA AI training manual
      url: https://developer.metax-tech.com/api/client/document/preview/587/C500_AITrainningMaunal_CN.html

- id: MXR-CUB-001
  version: 1
  title: 识别 CUB 用法
  category: library
  severity: info
  file_globs: ["**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.cc", "**/*.h", "**/*.hpp"]
  patterns:
    - type: regex
      expression: '\bcub::[A-Za-z_]'
    - type: regex
      expression: '(?m)^\s*#\s*include\s*[<"]cub/[A-Za-z0-9_./]+[>"]'
  message: 项目使用 CUB；MXMACA 提供 mcCUB 且对外 API 接口不变，通常无需改动源码。
  recommendation: 请复核 CUB 版本与 mcCUB 的对应关系，并在沐曦环境验证编译与结果。
  references:
    - title: MXMACA AI training manual
      url: https://developer.metax-tech.com/api/client/document/preview/587/C500_AITrainningMaunal_CN.html
