  message: 构建参数显式生成 NVIDIA compute/sm 目标，可能固化了设备架构假设。
  recommendation: 请复核目标架构参数，依据 MXMACA 工具链要求调整，并在沐曦设备验证生成物。
  references:
    - title: MXMACA performance tuning guide
      url: https://gitee.com/metax-maca/mxmaca-performance-tuning-guide

