  patterns:
    - type: regex
      expression: '(?m)^\s*#\s*include\s*[<"]cuda_runtime\.h[>"]'
  message: 源码直接包含 CUDA Runtime 头文件，需要由目标兼容层和工具链提供相应映射。
  recommendation: 请复核使用到的 Runtime API，并结合 cu-bridge 当前版本在沐曦环境验证编译与功能。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-HEADER-002
