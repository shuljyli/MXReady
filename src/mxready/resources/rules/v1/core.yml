- id: MXR-TOOLCHAIN-001
  version: 2
  title: 检测直接 nvcc 工具调用
  category: toolchain
  severity: blocker
  # Makefile / *.mk 必须在内：CUDA 侧大量项目（含 cuda-samples）用 Make 构建，
  # cu-bridge 的官方入口 make_maca 本身就是 make 包装器。此前这里漏掉 Makefile，
  # 导致 `NVCC = nvcc` 这类最容易命中的写法完全不可见。
  file_globs:
    [
      "**/*.py",
      "**/*.sh",
      "**/*.cmake",
      "**/CMakeLists.txt",
      "**/Makefile",
      "**/makefile",
      "**/GNUmakefile",
      "**/*.mk",
    ]
  patterns:
    - type: regex
      expression: '(?:subprocess\.(?:run|Popen|call|check_call|check_output)|os\.system)\s*\([^\n]{0,200}\bnvcc\b'
      flags: [IGNORECASE]
    - type: regex
      expression: '(?m)^\s*(?:NVCC|CMAKE_CUDA_COMPILER)\s*=\s*[^\n]*\bnvcc\b'
      flags: [IGNORECASE]
    - type: regex
      expression: '(?m)^\s*(?:[A-Za-z_][A-Za-z0-9_]*=\S+\s+)*(?:\S*/)?nvcc(?!\s*=)(?:\s|$)'
      flags: [IGNORECASE]
  message: 项目直接调用或固定指定 nvcc，迁移到 MXMACA/cu-bridge 时工具入口与参数需要复核。
  recommendation: 请复核调用点，按 cu-bridge 当前版本配置对应工具链，并在沐曦环境验证构建。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-TOOLCHAIN-002
  version: 1
  title: 识别 cu-bridge 工具链接入
  category: toolchain
  severity: info
  file_globs:
    [
      "**/*.py",
      "**/*.sh",
      "**/*.cmake",
      "**/CMakeLists.txt",
      "**/Makefile",
      "**/makefile",
      "**/GNUmakefile",
      "**/*.mk",
      "**/Dockerfile",
      "**/*.dockerfile",
    ]
  patterns:
    - type: fact
      name: uses_cu_bridge_toolchain
      equals: true
  message: 项目已包含 cu-bridge 工具链入口（make_maca / cmake_maca / cucc / CUCC_* 环境变量），构建层已接入 MXMACA 兼容层。
  recommendation: 请复核 cu-bridge 版本与 conf.json 的覆盖范围，并在沐曦环境验证构建；若有脚本绕过包装器直接调用 nvcc，仍需单独处理。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge
    - title: cu-bridge 使用手册
      url: https://gitee.com/p4ul/cu-bridge/tree/master

- id: MXR-PATH-001
  version: 1
  title: 检测硬编码 CUDA 安装路径
  category: path
  severity: warning
  file_globs:
    [
      "**/*.py",
      "**/*.sh",
      "**/*.cmake",
      "**/CMakeLists.txt",
      "**/*.toml",
      "**/*.cfg",
      "**/Makefile",
      "**/makefile",
      "**/GNUmakefile",
      "**/*.mk",
    ]
  patterns:
    - type: regex
      expression: '/usr/local/cuda(?:/|\b)'
  message: 项目硬编码了 /usr/local/cuda，可能绕过 MXMACA/cu-bridge 提供的工具链路径。
  recommendation: 请将路径改为可配置项，复核 cu-bridge 环境变量，并在沐曦服务器验证解析结果。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-PYTORCH-001
  version: 1
  title: 识别 PyTorch CUDAExtension
  category: pytorch-extension
  severity: info
  file_globs: ["**/*.py"]
  patterns:
    - type: fact
      name: uses_torch_cuda_extension
      equals: true
  message: 项目通过 PyTorch CUDAExtension 构建原生扩展，需要准备与目标工具链匹配的编译环境。
  recommendation: 请复核扩展源文件、编译参数与依赖库，并在 MXMACA PyTorch 环境完成最小构建验证。
  references:
    - title: PyTorch C++/CUDA extensions
      url: https://docs.pytorch.org/docs/stable/cpp_extension.html

- id: MXR-DEPENDENCY-001
  version: 1
  title: 检测 flash-attn 依赖
  category: dependency
  severity: warning
  file_globs: ["**/requirements*.txt", "**/pyproject.toml", "**/setup.cfg", "**/setup.py"]
  patterns:
    - type: dependency
      name: flash-attn
  message: 项目声明了 flash-attn，其原生扩展、架构参数与版本组合需要在目标平台单独验证。
  recommendation: 请复核 flash-attn 版本和构建选项，先验证最小导入与算子，再运行项目级测试。
  references:
    - title: PyTorch C++/CUDA extensions
      url: https://docs.pytorch.org/docs/stable/cpp_extension.html
  compatible_alternatives:
    - operator: torch.nn.functional.scaled_dot_product_attention
      summary: PyTorch 原生注意力算子，在 NVIDIA CUDA 与沐曦 MXMACA PyTorch 环境下均提供统一 Python 接口，由后端调度可用实现。
      applies_when: 常规因果/非因果注意力计算且不依赖 flash-attn 特有变长打包或自定义 ALiBi/滑动窗口扩展参数时。
      caveat: 不同后端（Flash/MemEfficient/Math）可用性与数值精度取决于 PyTorch 与驱动版本，迁移后需实测数值与显存占用。
      reference:
        title: PyTorch scaled_dot_product_attention
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.scaled_dot_product_attention.html
    - operator: PyTorch 显式注意力参考实现（matmul + softmax）
      summary: 使用标准张量矩阵乘、掩码与 softmax 组合实现，不依赖第三方原生 CUDA 扩展，可在 CUDA 与 MXMACA 间一致运行。
      applies_when: 作为缺少融合内核时的回退路径或用于小规模输入与数值对拍基线。
      caveat: 显存与吞吐显著高于融合注意力实现，仅建议用于回退路径或最小一致性校验。
      reference:
        title: PyTorch Testing
        url: https://docs.pytorch.org/docs/stable/testing.html

- id: MXR-CMAKE-001
