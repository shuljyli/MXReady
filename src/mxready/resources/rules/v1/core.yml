- id: MXR-DEPENDENCY-002
  version: 1
  title: 检测 bitsandbytes 依赖
  category: dependency
  severity: warning
  file_globs: ["**/requirements*.txt", "**/pyproject.toml", "**/setup.cfg", "**/setup.py"]
  patterns:
    - type: dependency
      name: bitsandbytes
  message: bitsandbytes 包含原生 GPU 组件和设备相关构建逻辑，需要单独确认目标平台版本。
  recommendation: 请复核依赖版本、预编译包来源和算子覆盖，并在沐曦环境验证导入与核心功能。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge
  compatible_alternatives:
    - operator: PyTorch 原生半精度路径（torch.bfloat16 / torch.float16）或通用量化回退
      summary: 在缺少目标平台 bitsandbytes 预编译内核时，通过 PyTorch 原生半精度张量或标准量化接口保持跨 CUDA/MXMACA 可运行性。
      applies_when: 模型支持以 FP16/BF16 加载或可通过配置关闭 4bit/8bit bitsandbytes 线性层。
      caveat: 显存需求会高于低比特量化，且不同平台半精度累加行为需结合业务精度阈值实测验证。
      reference:
        title: PyTorch Automatic Mixed Precision
        url: https://docs.pytorch.org/docs/stable/amp.html

- id: MXR-DEPENDENCY-003
  version: 1
  title: 检测 xformers 依赖
  category: dependency
  severity: warning
  file_globs: ["**/requirements*.txt", "**/pyproject.toml", "**/setup.cfg", "**/setup.py"]
  patterns:
    - type: dependency
      name: xformers
  message: xformers 可能构建并选择设备特定的原生算子，需确认版本与工具链组合。
  recommendation: 请复核 xformers 构建选项和算子回退路径，并在沐曦环境验证项目实际调用链。
  references:
    - title: PyTorch C++/CUDA extensions
      url: https://docs.pytorch.org/docs/stable/cpp_extension.html
  compatible_alternatives:
    - operator: torch.nn.functional.scaled_dot_product_attention
      summary: 替代 xformers.ops.memory_efficient_attention 的 PyTorch 原生跨平台接口，可在 CUDA 与 MXMACA PyTorch 中统一调用。
      applies_when: 项目主要使用 xformers 的注意力计算且掩码格式可映射到 attn_mask 或 is_causal。
      caveat: 自定义 bias 布局、dropout 生成器或 SwiGLU 等扩展算子无直接一对一替代时仍需保留条件分支并在目标设备验证。
      reference:
        title: PyTorch scaled_dot_product_attention
        url: https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.scaled_dot_product_attention.html

- id: MXR-DEPENDENCY-004
  version: 1
  title: 检测 TensorRT 依赖或导入
  category: dependency
  severity: blocker
  file_globs: ["**/requirements*.txt", "**/pyproject.toml", "**/setup.cfg", "**/setup.py", "**/*.py"]
  patterns:
    - type: dependency
      name: tensorrt
    - type: fact
      name: imports_tensorrt
      equals: true
  message: 项目直接依赖或导入 TensorRT，当前执行路径包含 NVIDIA 专用运行时边界。
  recommendation: 请复核是否存在可替换后端或隔离路径，并先验证沐曦目标栈的等价推理流程。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge
  compatible_alternatives:
    - operator: PyTorch 原生推理路径（torch.inference_mode / torch.compile）
      summary: 以 PyTorch 原生 eager 或编译推理路径隔离 TensorRT 引擎依赖，便于在 NVIDIA CUDA 与沐曦推理栈间切换。
      applies_when: 模型已有标准 PyTorch 前向定义，且推理部署允许绕开 TensorRT 序列化计划文件。
      caveat: 不同平台 torch.compile 后端支持度和延迟特征存在差异，须在目标 GPU 上重新验证吞吐与精度。
      reference:
        title: PyTorch Compiler
        url: https://docs.pytorch.org/docs/stable/torch.compiler.html

- id: MXR-HEADER-001
