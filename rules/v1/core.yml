- id: MXR-TOOLCHAIN-001
  version: 1
  title: 检测直接 nvcc 工具调用
  category: toolchain
  severity: blocker
  file_globs: ["**/*.py", "**/*.sh", "**/*.cmake", "**/CMakeLists.txt"]
  patterns:
    - type: regex
      expression: '(?:subprocess\.(?:run|Popen|call|check_call|check_output)|os\.system)\s*\([^\n]{0,200}\bnvcc\b'
      flags: [IGNORECASE]
    - type: regex
      expression: '(?m)^\s*(?:NVCC|CMAKE_CUDA_COMPILER)\s*=\s*[^\n]*\bnvcc\b'
      flags: [IGNORECASE]
    - type: regex
      expression: '(?m)^\s*(?:[A-Za-z_][A-Za-z0-9_]*=\S+\s+)*(?:\S*/)?nvcc(?!\s*=)(?:\s|$)'
      flags: [IGNORECASE]
  message: 项目直接调用或固定指定 nvcc，迁移到 MXMACA/cu-bridge 时工具入口与参数需要复核。
  recommendation: 请复核调用点，按 cu-bridge 当前版本配置对应工具链，并在沐曦环境验证构建。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-PATH-001
  version: 1
  title: 检测硬编码 CUDA 安装路径
  category: path
  severity: warning
  file_globs: ["**/*.py", "**/*.sh", "**/*.cmake", "**/CMakeLists.txt", "**/*.toml", "**/*.cfg"]
  patterns:
    - type: regex
      expression: '/usr/local/cuda(?:/|\b)'
  message: 项目硬编码了 /usr/local/cuda，可能绕过 MXMACA/cu-bridge 提供的工具链路径。
  recommendation: 请将路径改为可配置项，复核 cu-bridge 环境变量，并在沐曦服务器验证解析结果。
  references:
    - title: MetaX-MACA cu-bridge
      url: https://gitee.com/metax-maca/cu-bridge

- id: MXR-PYTORCH-001
