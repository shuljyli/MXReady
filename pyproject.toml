[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "mxready"
version = "0.1.0"
description = "Static readiness checks for moving PyTorch CUDA extensions to MetaX MXMACA"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "shuli-黍黎"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
load = [
  "locust>=2.32,<3",
]

[project.scripts]
mxready-build-bundle = "scripts.build_verification_bundle:main"
mxready-scan = "scripts.scan_repository:main"
mxready-scan-public = "scripts.generate_public_report:main"
mxready-runner = "mxready_runner.cli:main"

[tool.setuptools.packages.find]
where = ["backend", "runner", "."]
include = ["mxready*", "mxready_runner*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-temp"
testpaths = ["tests"]
pythonpath = ["backend", "runner", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
