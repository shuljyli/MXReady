[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "mxready"
version = "0.3.0"
description = "Static readiness checks for moving PyTorch CUDA extensions to MetaX MXMACA"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "shuli-黍黎"}]
keywords = ["cuda", "pytorch", "metax", "mxmaca", "migration", "static-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "setuptools>=83",
  "httpx>=0.27,<1",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12",
]
load = [
  "locust>=2.32,<3",
]

[project.urls]
Homepage = "https://github.com/shuljyli/MXReady"
Repository = "https://github.com/shuljyli/MXReady"
Issues = "https://github.com/shuljyli/MXReady/issues"
Changelog = "https://github.com/shuljyli/MXReady/blob/main/CHANGELOG.md"

[project.scripts]
mxready-serve = "mxready.cli.serve:main"
mxready-build-bundle = "mxready.cli.build_verification_bundle:main"
mxready-scan = "mxready.cli.scan_repository:main"
mxready-scan-public = "mxready.cli.generate_public_report:main"
mxready-scan-batch = "mxready.cli.scan_batch:main"
mxready-runner = "mxready_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mxready*"]

[tool.setuptools.package-data]
"mxready" = ["py.typed"]
"mxready_runner" = ["py.typed"]
"mxready.resources" = ["rules/v1/*.yml", "schemas/*.json", "frontend/*", "frontend/assets/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-temp"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "packaging"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
# 只统计语句覆盖率会漏掉"分支只走了一半"的情况，发布前按分支口径衡量。
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
