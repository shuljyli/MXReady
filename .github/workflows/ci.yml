name: CI

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests
      - run: python -m mypy
      - run: python scripts/generate_contracts.py --check
      - run: >-
          python -m pytest
          --cov=mxready
          --cov=mxready_runner
          --cov-report=term-missing
          --cov-fail-under=80
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\make.ps1 clean

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade "setuptools>=83" -e . pip-audit
      - run: python -m pip_audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mxready:ci .
      - name: Start image and check API and frontend
        run: |
          docker run -d --name mxready-ci -p 127.0.0.1:8000:8000 mxready:ci
          curl --fail --retry 15 --retry-all-errors --retry-connrefused --retry-delay 1 \
            --retry-max-time 30 --connect-timeout 1 --max-time 3 http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:8000/ --output /tmp/mxready-index.html
          test -s /tmp/mxready-index.html
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs mxready-ci || true
          docker rm -f mxready-ci || true

  server-handover-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          for script in \
            scripts/dev.sh \
            examples/verification/checkout-commit.sh \
            examples/verification/run-inspect.sh \
            examples/verification/pre-upload-check.sh; do
            bash -n "$script"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
