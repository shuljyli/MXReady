name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests packaging
      - run: python -m mypy
      - run: python -m pytest tests/integration tests/backend/test_serve_cli.py
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python -c "import os,tomllib;
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag/version mismatch'"
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
          retention-days: 7

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - run: python scripts/smoke_release.py --dist dist

  artifacts:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: mxready-installers
          path: dist/
          retention-days: 30
