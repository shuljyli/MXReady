name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -c packaging/runtime-constraints.txt -e ".[dev]"
      - run: python -m ruff check src scripts tests packaging
      - run: python -m ruff format --check src scripts tests packaging
      - run: python -m mypy
      - run: python -m pytest tests/integration tests/backend/test_serve_cli.py
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python -c "import os,tomllib;
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag/version mismatch'"
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
          retention-days: 7

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - name: Install and restart with the default user data directory
        run: >-
          python scripts/smoke_release.py --dist dist
          --evidence-dir evidence/online --candidate-commit ${{ github.sha }}
      - name: Prepare matching offline dependencies
        run: >-
          python -c "import glob,subprocess,sys;
          subprocess.run([sys.executable,'-m','pip','download','--only-binary=:all:',
          '--constraint','packaging/runtime-constraints.txt',
          '--dest','wheelhouse',*glob.glob('dist/*.whl')],check=True)"
      - name: Check missing dependencies and install without a package index
        run: >-
          python scripts/smoke_release.py --dist dist --wheelhouse wheelhouse
          --evidence-dir evidence/offline --candidate-commit ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-evidence-${{ matrix.os }}-python-${{ matrix.python }}
          path: evidence/
          retention-days: 30

  artifacts:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: mxready-installers
          path: dist/
          retention-days: 30

  # 打 tag 时把附件挂到 GitHub Release。此前流程只上传 workflow artifact，
  # Release 页面始终为空，而 README 又指引用户去 Releases 下载。
  release:
    needs: artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: mxready-installers
          path: dist
      - name: Render release notes from CHANGELOG
        run: >-
          python scripts/release_notes.py
          --version "${GITHUB_REF_NAME#v}"
          --output dist/RELEASE_NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(dist/*.zip dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt dist/build-provenance.json)
          # 重跑同一 tag 时改为覆盖附件，避免"Release 已存在"直接失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "MXReady ${TAG}" \
              --notes-file dist/RELEASE_NOTES.md \
              "${assets[@]}"
          fi

  # PyPI 只接受 wheel 与 sdist，ZIP、SHA256SUMS.txt 与 build-provenance.json 仍只挂 GitHub Release。
  # 上传的是 install 作业在 Windows/Linux/macOS 上真实装过的同一份产物，不重新构建一次。
  # 注册表上的版本一旦上线就不能覆盖，所以这里不接受 --clobber 语义：同一 tag 重跑会被 PyPI 拒绝，
  # 必须先递增 pyproject 版本号。
  pypi:
    needs: artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 必须与 PyPI 受信发布者配置里的 Environment 字段一致，否则 OIDC 令牌换不到上传权限。
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mxready-installers
          path: dist
      - name: Keep only the distributions PyPI accepts
        run: |
          set -euo pipefail
          mkdir -p dist-pypi
          cp dist/mxready-*.whl dist/mxready-*.tar.gz dist-pypi/
          ls -l dist-pypi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi
