name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests packaging
      - run: python -m ruff format --check src scripts tests packaging
      - run: python -m mypy
      - run: python -m pytest tests/integration tests/backend/test_serve_cli.py
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python -c "import os,tomllib;
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag/version mismatch'"
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
          retention-days: 7

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - run: python scripts/smoke_release.py --dist dist

  artifacts:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: mxready-installers
          path: dist/
          retention-days: 30

  # 打 tag 时把附件挂到 GitHub Release。此前流程只上传 workflow artifact，
  # Release 页面始终为空，而 README 又指引用户去 Releases 下载。
  release:
    needs: artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: mxready-installers
          path: dist
      - name: Render release notes from CHANGELOG
        run: >-
          python scripts/release_notes.py
          --version "${GITHUB_REF_NAME#v}"
          --output dist/RELEASE_NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(dist/*.zip dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt)
          # 重跑同一 tag 时改为覆盖附件，避免"Release 已存在"直接失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "MXReady ${TAG}" \
              --notes-file dist/RELEASE_NOTES.md \
              "${assets[@]}"
          fi
